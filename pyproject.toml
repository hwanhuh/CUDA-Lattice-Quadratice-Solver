[build-system]
requires = [
    "scikit-build-core>=0.11,<1.1",
    "pybind11>=2.13,<4",
    "nvidia-cuda-cccl-cu12==12.8.90; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.8.57; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cublas-cu12>=12.1,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12>=12.1,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "lattice-qp"
version = "0.2.0"
description = "CUDA-accelerated policy-driven solver for sparse convex lattice QPs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Hwan Heo", email = "gjghks950@naver.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "nvidia-cublas-cu12>=12.1,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12>=12.1,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12>=12.1,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["lattice_qp"]
wheel.license-files = ["LICENSE"]
wheel.reproducible = true
sdist.reproducible = true
sdist.include = [
    "/CMakeLists.txt",
    "src/*.cpp",
    "src/*.cu",
    "src/*.cuh",
    "src/*.hpp",
    "lattice_qp/**/*.py",
    "benchmarks/*.py",
    "tests/*.py",
]
sdist.exclude = [
    "/.uv-cache/",
    ".uv-cache/",
    "**/__pycache__/**",
    "**/*.pyc",
    ".uv-cache/**",
    "build/**",
    "dist/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
